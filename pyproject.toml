[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cermin-algoritma"
version = "0.1.0"
description = "Simulasi bobot umpan pada platform rekaan untuk menelaah politik artefak."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "M. Badaruddin" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
